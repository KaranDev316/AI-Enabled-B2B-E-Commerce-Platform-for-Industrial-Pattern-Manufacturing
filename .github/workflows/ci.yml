name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kpc_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: kpc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kpc_test -d kpc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kpc_test:ci_test_only@localhost:5432/kpc_test
      S07_POSTGRES_TEST_URL: postgresql+psycopg://kpc_test:ci_test_only@localhost:5432/kpc_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Check automatic migrations and repeat startup
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          python start.py --migrate-only
          python start.py --migrate-only
      - run: python -m pytest -q -ra

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm run build
